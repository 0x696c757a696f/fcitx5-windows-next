[package]
name = "fcitx5-candidate-core"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false

[dependencies]
tiny-skia = "0.12"
windui = { path = "../../third_party/wind-ui-rust", default-features = false }
fcitx5-protocol-core = { path = "../protocol-core" }
fcitx5-windows-common-core = { path = "../windows-common-core" }

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "fcitx5-candidate-poc"
path = "src/bin/candidate_poc.rs"
