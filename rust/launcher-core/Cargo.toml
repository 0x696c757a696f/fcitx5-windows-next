[package]
name = "fcitx5-launcher-core"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "fcitx5-launcher"
path = "src/main.rs"

[dependencies]
fcitx5-process-execution-core = { path = "../process-execution-core" }
fcitx5-protocol-core = { path = "../protocol-core" }
fcitx5-windows-common-core = { path = "../windows-common-core" }
