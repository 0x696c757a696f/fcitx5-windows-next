# Fcitx5 内置候选主题。主题只控制外观，不改变选词键、候选顺序或提交语义。
format_version = 1

[theme]
id = "builtin.nord"
name = "Nord"
version = "1.0.0"
license = "MIT"
description = "Arctic, north-bluish palette after the Nord color scheme"

[common.candidate]
layout_type = "scroll" # automatic | stacked | flow | scroll | vertical_text
scroll_direction = "horizontal" # horizontal | vertical (scroll only)
vertical_text_column_direction = "right_to_left" # right_to_left | left_to_right
max_width_dip = 860.0
opacity = 1.0

[common.candidate.geometry]
# 所有尺寸均为 DIP，会随每个显示器的 DPI 缩放。
padding_x_dip = 10.0
padding_y_dip = 6.0
corner_radius_dip = 10.0
border_width_dip = 1.0
row_gap_dip = 1.0
column_gap_dip = 12.0
item_padding_x_dip = 8.0
item_padding_y_dip = 4.0

[common.fonts.candidate]
families = ["Microsoft YaHei", "Microsoft YaHei UI", "system"]
size_dip = 18.0
weight = 400

[common.fonts.annotation]
families = ["inherit"]
scale = 0.80

[common.candidate.label]
visible = true
style = "dot"
font_scale = 0.85

[light.candidate.colors]
background = "#ECEFF4FF"
border = "#D8DEE9FF"
candidate_text = "#2E3440FF"
label_text = "#7B88A1FF"
comment_text = "#6F7B92FF"
selected_background = "#5E81ACFF"
selected_candidate_text = "#ECEFF4FF"
selected_label_text = "#D8DEE9FF"
selected_comment_text = "#D8DEE9FF"
preedit_text = "#5E81ACFF"

[dark.candidate.colors]
background = "#2E3440FF"
border = "#3B4252FF"
candidate_text = "#ECEFF4FF"
label_text = "#7B88A1FF"
comment_text = "#8F9BB3FF"
selected_background = "#88C0D0FF"
selected_candidate_text = "#2E3440FF"
selected_label_text = "#3B4252FF"
selected_comment_text = "#3B4252FF"
preedit_text = "#88C0D0FF"
