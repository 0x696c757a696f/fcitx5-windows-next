# Fcitx5 内置候选主题。主题只控制外观，不改变选词键、候选顺序或提交语义。
format_version = 1

[theme]
id = "builtin.amber"
name = "Amber"
version = "1.0.0"
license = "MIT"
description = "Warm paper and amber, easy on the eyes at night"

[common.candidate]
layout_type = "scroll" # automatic | stacked | flow | scroll | vertical_text
scroll_direction = "horizontal" # horizontal | vertical (scroll only)
vertical_text_column_direction = "right_to_left" # right_to_left | left_to_right
max_width_dip = 860.0
opacity = 1.0

[common.candidate.geometry]
# 所有尺寸均为 DIP，会随每个显示器的 DPI 缩放。
padding_x_dip = 8.0
padding_y_dip = 4.0
corner_radius_dip = 12.0
border_width_dip = 1.0
row_gap_dip = 2.0
column_gap_dip = 12.0
item_padding_x_dip = 8.0
item_padding_y_dip = 4.0

[common.fonts.candidate]
families = ["Microsoft YaHei", "Microsoft YaHei UI", "system"]
size_dip = 18.0
weight = 400

[common.fonts.annotation]
families = ["inherit"]
scale = 0.80

[common.candidate.label]
visible = true
style = "dot"
font_scale = 0.85

[light.candidate.colors]
background = "#FBF7EFFF"
border = "#EDE4D3FF"
candidate_text = "#3A3226FF"
label_text = "#A3967FFF"
comment_text = "#958871FF"
selected_background = "#D97706FF"
selected_candidate_text = "#FFFFFFFF"
selected_label_text = "#FFE8C7FF"
selected_comment_text = "#FFE8C7FF"
preedit_text = "#B45F06FF"

[dark.candidate.colors]
background = "#211D17FF"
border = "#3A3328FF"
candidate_text = "#EDE6DAFF"
label_text = "#8C8170FF"
comment_text = "#9A8F7DFF"
selected_background = "#F59E0BFF"
selected_candidate_text = "#1A1A1AFF"
selected_label_text = "#4A3A12FF"
selected_comment_text = "#4A3A12FF"
preedit_text = "#FBBF24FF"
