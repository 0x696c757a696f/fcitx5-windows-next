# Fcitx5 内置候选主题。主题只控制外观，不改变选词键、候选顺序或提交语义。
format_version = 1

[theme]
id = "builtin.azure"
name = "Azure"
version = "1.0.0"
license = "MIT"
description = "Clear blue selection on a crisp surface"

[common.candidate]
layout_type = "scroll" # automatic | stacked | flow | scroll | vertical_text
scroll_direction = "horizontal" # horizontal | vertical (scroll only)
vertical_text_column_direction = "right_to_left" # right_to_left | left_to_right
max_width_dip = 860.0
opacity = 1.0

[common.candidate.geometry]
# 所有尺寸均为 DIP，会随每个显示器的 DPI 缩放。
padding_x_dip = 8.0
padding_y_dip = 4.0
corner_radius_dip = 12.0
border_width_dip = 1.0
row_gap_dip = 2.0
column_gap_dip = 12.0
item_padding_x_dip = 8.0
item_padding_y_dip = 4.0

[common.fonts.candidate]
families = ["Microsoft YaHei", "Microsoft YaHei UI", "system"]
size_dip = 18.0
weight = 400

[common.fonts.annotation]
families = ["inherit"]
scale = 0.80

[common.candidate.label]
visible = true
style = "dot"
font_scale = 0.85

[light.candidate.colors]
background = "#FFFFFFFF"
border = "#E3E8F0FF"
candidate_text = "#1B2430FF"
label_text = "#8A94A6FF"
comment_text = "#7B8698FF"
selected_background = "#2F6FEBFF"
selected_candidate_text = "#FFFFFFFF"
selected_label_text = "#DCE7FFFF"
selected_comment_text = "#DCE7FFFF"
preedit_text = "#2F6FEBFF"

[dark.candidate.colors]
background = "#16191FFF"
border = "#2A3039FF"
candidate_text = "#E6EAF0FF"
label_text = "#6E7887FF"
comment_text = "#7F8A9AFF"
selected_background = "#4C8DFFFF"
selected_candidate_text = "#FFFFFFFF"
selected_label_text = "#E3ECFFFF"
selected_comment_text = "#E3ECFFFF"
preedit_text = "#7FAEFFFF"
