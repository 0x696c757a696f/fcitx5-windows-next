# Fcitx5 内置候选主题。主题只控制外观，不改变选词键、候选顺序或提交语义。
format_version = 1

[theme]
id = "builtin.default"
name = "Fcitx5 Default"
version = "1.0.0"
license = "MIT"
description = "Readable system-aware candidate theme"

[common.candidate]
orientation = "vertical" # vertical | horizontal
max_width_dip = 720.0
opacity = 1.0

[common.candidate.geometry]
# 所有尺寸均为 DIP，会随每个显示器的 DPI 缩放。
padding_x_dip = 8.0
padding_y_dip = 6.0
corner_radius_dip = 8.0

[common.fonts.candidate]
families = ["Microsoft YaHei", "system"]
size_dip = 16.0
weight = 400

[common.fonts.annotation]
families = ["inherit"]
scale = 0.80

[common.candidate.label]
# 仅改变 label 的显示形式；实际按键仍由 Fcitx 决定。
visible = true
style = "dot"
font_scale = 0.85

[light.candidate.colors]
background = "#FFFFFFFF"
candidate_text = "#202124FF"
selected_background = "#D2E3FCFF"
selected_candidate_text = "#174EA6FF"

[dark.candidate.colors]
background = "#202124F2"
candidate_text = "#FFFFFFFF"
selected_background = "#8AB4F8FF"
selected_candidate_text = "#202124FF"
