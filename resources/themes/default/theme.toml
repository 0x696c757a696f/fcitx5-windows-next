# Fcitx5 内置候选主题。主题只控制外观，不改变选词键、候选顺序或提交语义。
format_version = 1

[theme]
id = "builtin.default"
name = "Fcitx5 Default"
version = "1.0.0"
license = "MIT"
description = "Readable system-aware candidate theme"

[common.candidate]
orientation = "vertical" # vertical | horizontal
max_width_dip = 860.0
opacity = 1.0

[common.candidate.geometry]
# 所有尺寸均为 DIP，会随每个显示器的 DPI 缩放。
padding_x_dip = 10.0
padding_y_dip = 6.0
corner_radius_dip = 12.0
border_width_dip = 1.0
row_gap_dip = 1.0
column_gap_dip = 12.0
item_padding_x_dip = 8.0
item_padding_y_dip = 4.0

[common.fonts.candidate]
families = ["Microsoft YaHei", "system"]
size_dip = 18.0
weight = 400

[common.fonts.annotation]
families = ["inherit"]
scale = 0.80

[common.candidate.label]
# 仅改变 label 的显示形式；实际按键仍由 Fcitx 决定。
visible = true
style = "dot"
font_scale = 0.85

[light.candidate.colors]
background = "#FCFCFCFA"
border = "#D7D9DDFF"
candidate_text = "#303236FF"
label_text = "#85888DFF"
comment_text = "#85888DFF"
selected_background = "#00B578FF"
selected_candidate_text = "#FFFFFFFF"
selected_label_text = "#FFFFFFFF"
selected_comment_text = "#E9FFF7FF"

[dark.candidate.colors]
background = "#242629F7"
border = "#4A4D52FF"
candidate_text = "#FFFFFFFF"
label_text = "#AEB2B8FF"
comment_text = "#AEB2B8FF"
selected_background = "#00A76FFF"
selected_candidate_text = "#FFFFFFFF"
selected_label_text = "#FFFFFFFF"
selected_comment_text = "#E5FFF5FF"
