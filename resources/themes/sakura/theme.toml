# Fcitx5 内置候选主题。主题只控制外观，不改变选词键、候选顺序或提交语义。
format_version = 1

[theme]
id = "builtin.sakura"
name = "Sakura"
version = "1.0.0"
license = "MIT"
description = "Soft blossom pink with warm neutral text"

[common.candidate]
layout_type = "scroll" # automatic | stacked | flow | scroll | vertical_text
scroll_direction = "horizontal" # horizontal | vertical (scroll only)
vertical_text_column_direction = "right_to_left" # right_to_left | left_to_right
max_width_dip = 860.0
opacity = 1.0

[common.candidate.geometry]
# 所有尺寸均为 DIP，会随每个显示器的 DPI 缩放。
padding_x_dip = 8.0
padding_y_dip = 4.0
corner_radius_dip = 16.0
border_width_dip = 1.0
row_gap_dip = 2.0
column_gap_dip = 12.0
item_padding_x_dip = 8.0
item_padding_y_dip = 4.0

[common.fonts.candidate]
families = ["Microsoft YaHei", "Microsoft YaHei UI", "system"]
size_dip = 18.0
weight = 400

[common.fonts.annotation]
families = ["inherit"]
scale = 0.80

[common.candidate.label]
visible = true
style = "dot"
font_scale = 0.85

[light.candidate.colors]
background = "#FFF9FBFF"
border = "#F6E3EAFF"
candidate_text = "#3A2A30FF"
label_text = "#B49AA4FF"
comment_text = "#A68C96FF"
selected_background = "#E5487AFF"
selected_candidate_text = "#FFFFFFFF"
selected_label_text = "#FFE0EAFF"
selected_comment_text = "#FFE0EAFF"
preedit_text = "#D23C6CFF"

[dark.candidate.colors]
background = "#1F1A1CFF"
border = "#3A2E33FF"
candidate_text = "#F2E6EAFF"
label_text = "#8E7880FF"
comment_text = "#9C858DFF"
selected_background = "#F06292FF"
selected_candidate_text = "#FFFFFFFF"
selected_label_text = "#FFE3ECFF"
selected_comment_text = "#FFE3ECFF"
preedit_text = "#F48FB1FF"
