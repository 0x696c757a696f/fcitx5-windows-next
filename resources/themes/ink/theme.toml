# Fcitx5 内置候选主题。主题只控制外观，不改变选词键、候选顺序或提交语义。
format_version = 1

[theme]
id = "builtin.ink"
name = "Ink"
version = "1.0.0"
license = "MIT"
description = "Monochrome ink on paper: a quiet theme with no accent color"

[common.candidate]
layout_type = "scroll" # automatic | stacked | flow | scroll | vertical_text
scroll_direction = "horizontal" # horizontal | vertical (scroll only)
vertical_text_column_direction = "right_to_left" # right_to_left | left_to_right
max_width_dip = 860.0
opacity = 1.0

[common.candidate.geometry]
# 所有尺寸均为 DIP，会随每个显示器的 DPI 缩放。
padding_x_dip = 8.0
padding_y_dip = 4.0
corner_radius_dip = 8.0
border_width_dip = 1.0
row_gap_dip = 2.0
column_gap_dip = 12.0
item_padding_x_dip = 8.0
item_padding_y_dip = 4.0

[common.fonts.candidate]
families = ["Microsoft YaHei", "Microsoft YaHei UI", "system"]
size_dip = 18.0
weight = 400

[common.fonts.annotation]
families = ["inherit"]
scale = 0.80

[common.candidate.label]
visible = true
style = "plain"
font_scale = 0.85

[light.candidate.colors]
background = "#FFFFFFFF"
border = "#E6E6E6FF"
candidate_text = "#1F1F1FFF"
label_text = "#9A9A9AFF"
comment_text = "#8C8C8CFF"
selected_background = "#1F1F1FFF"
selected_candidate_text = "#FFFFFFFF"
selected_label_text = "#BDBDBDFF"
selected_comment_text = "#D0D0D0FF"
preedit_text = "#1F1F1FFF"

[dark.candidate.colors]
background = "#1C1C1EFF"
border = "#2C2C2EFF"
candidate_text = "#E8E8E8FF"
label_text = "#7C7C80FF"
comment_text = "#8E8E93FF"
selected_background = "#F2F2F2FF"
selected_candidate_text = "#111111FF"
selected_label_text = "#5C5C5CFF"
selected_comment_text = "#4A4A4AFF"
preedit_text = "#E8E8E8FF"
