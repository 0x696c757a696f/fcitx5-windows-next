name: Core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    name: MSVC ${{ matrix.architecture }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - name: Require PowerShell 7
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -ne 7) {
            throw "PowerShell 7 is required; found $($PSVersionTable.PSVersion)."
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Build, analyze, test, and run policy checks
        shell: pwsh
        run: ./tools/verify-product.ps1 pr -Architecture ${{ matrix.architecture }}
