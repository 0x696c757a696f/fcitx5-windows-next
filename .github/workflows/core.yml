name: Core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    name: ClangCL ${{ matrix.architecture }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86, arm64]
    steps:
      - name: Require PowerShell 7
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -ne 7) {
            throw "PowerShell 7 is required; found $($PSVersionTable.PSVersion)."
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Restore Rust toolchain and target cache
        uses: actions/cache@v4
        with:
          path: |
            out/toolchains/rust/rustup-home
            out/toolchains/rust/cargo-home/registry
            out/toolchains/rust/cargo-home/git
            out/toolchains/rust/cargo-home/bin
            out/toolchains/rust/target
          key: ${{ runner.os }}-${{ matrix.architecture }}-rust-msvc-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**/Cargo.toml', 'tools/prepare-rust.ps1') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.architecture }}-rust-msvc-
            ${{ runner.os }}-rust-msvc-

      - name: Install sccache compiler cache
        uses: Mozilla-Actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Prepare fast Windows toolchain
        shell: pwsh
        run: ./tools/prepare-fast-toolchain.ps1 -InstallForCI

      - name: Configure CI compiler cache
        shell: pwsh
        run: ./tools/configure-ci-cache.ps1

      - name: Build, analyze, test, and run policy checks
        shell: pwsh
        run: |
          if ('${{ matrix.architecture }}' -eq 'arm64') {
            # ARM64 is a cross-compile lane on x64 runners: build and run the
            # static policy checks, but skip CTest because ARM64 executables
            # cannot start on an x64 host. The native Fcitx engine is x64/x86.
            ./tools/build.ps1 dev -Architecture arm64 -Configuration Release
            ./tools/check-runtime-security.ps1 -Architecture arm64 -Configuration Release
            ./tools/check-secrets.ps1
            ./tools/check-licenses.ps1
            ./tools/check-dependencies.ps1
            ./tools/check-locales.ps1
            ./tools/check-text-format.ps1
          } else {
            ./tools/verify-product.ps1 pr -Architecture ${{ matrix.architecture }}
          }

      - name: Show compiler cache stats
        if: always()
        shell: pwsh
        run: |
          $sccache = Get-Command sccache -ErrorAction SilentlyContinue
          if ($sccache) {
            & $sccache.Source --show-stats
          }
