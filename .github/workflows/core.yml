name: Core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: MSVC ${{ matrix.architecture }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build, analyze, test, and run policy checks
        shell: pwsh
        run: ./tools/build.ps1 test -Architecture ${{ matrix.architecture }}
