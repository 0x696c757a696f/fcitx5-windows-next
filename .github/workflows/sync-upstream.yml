name: Sync upstream

on:
  schedule:
    # Weekly, Monday 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream

defaults:
  run:
    shell: pwsh

jobs:
  windui:
    name: Sync wind-ui-rust
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare toolchains
        shell: pwsh
        run: |
          ./tools/prepare-fast-toolchain.ps1 -InstallForCI
          ./tools/prepare-rust.ps1
          ./tools/prepare-package-dependencies.ps1

      - name: Sync wind-ui-rust to upstream HEAD
        shell: pwsh
        run: |
          & ./tools/sync-windui.ps1 -Latest
          python tools/update-rust-dependencies.py --skip-toolchain --skip-cargo-update
          if ($LASTEXITCODE -ne 0) { throw 'crate inventory sync failed' }

      - name: Show sync log
        if: failure()
        shell: pwsh
        run: Get-Content out/tmp/wind-ui-sync-*.log -ErrorAction SilentlyContinue

      - name: Detect windui change and open PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: upstream/wind-ui-rust
          delete-branch: true
          commit-message: 'chore(vendor): sync wind-ui-rust to upstream HEAD'
          title: 'chore(vendor): sync wind-ui-rust to upstream HEAD'
          body: |
            Automated upstream sync of the vendored `huanfeng/wind-ui-rust`
            path dependency. Re-applies the local patch queue in
            `third_party/patches/wind-ui-rust` (3-way, fail-closed on a real
            conflict) and updates the pin in `dependencies.json`.

            Merged automatically once Core passes on this commit.

      - name: Run Core on the PR head
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Pushes made with GITHUB_TOKEN do not start pull_request workflows.
        run: gh workflow run core.yml --ref upstream/wind-ui-rust

  fcitx:
    name: Sync fcitx5 core and addon pins
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bump drifted fcitx5/addon pins to upstream HEAD
        shell: pwsh
        run: |
          & ./tools/sync-fcitx-pins.ps1 -Latest

      - name: Open PR for pin bumps
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: upstream/fcitx5-pins
          delete-branch: true
          commit-message: 'chore(pins): bump fcitx5 core/addon upstream pins'
          title: 'chore(pins): bump fcitx5 core/addon upstream pins'
          body: |
            Automated pin bump for the fcitx5 core and addon sources recorded
            in `tools/bootstrap-fcitx.ps1` `$sourcePins`. This only updates the
            pinned commits; it does NOT verify the patch queue still applies.

            Patch compatibility is checked by the Preview Package build of
            this branch; the PR is merged automatically once both Core and
            Preview Package pass on this commit.

      - name: Run Core and Preview Package on the PR head
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Pushes made with GITHUB_TOKEN do not start pull_request workflows.
        run: |
          gh workflow run core.yml --ref upstream/fcitx5-pins
          gh workflow run preview-package.yml --ref upstream/fcitx5-pins
