name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the protected v<version> tag
        required: true
        type: string
      channel:
        description: Release identity and repository channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, nightly]
      plugin_release_sequence:
        description: Monotonic release sequence for the official fcitx5-rime package
        required: true
        type: number

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-once:
    runs-on: windows-2022
    steps:
      - name: Require PowerShell 7
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -ne 7) {
            throw "PowerShell 7 is required; found $($PSVersionTable.PSVersion)."
          }

      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Restore Rust toolchain and target cache
        uses: actions/cache@v6
        with:
          path: |
            out/toolchains/rust/rustup-home
            out/toolchains/rust/cargo-home/registry
            out/toolchains/rust/cargo-home/git
            out/toolchains/rust/cargo-home/bin
            out/toolchains/rust/target
          key: ${{ runner.os }}-release-rust-msvc-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**/Cargo.toml', 'tools/prepare-rust.ps1') }}
          restore-keys: |
            ${{ runner.os }}-release-rust-msvc-
            ${{ runner.os }}-rust-msvc-

      - name: Install sccache compiler cache
        uses: Mozilla-Actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Restore fast Windows toolchain cache
        uses: actions/cache@v6
        with:
          path: out/toolchains/fast
          key: ${{ runner.os }}-release-fast-toolchain-llvm-22.1.8-cmake-3.31.8-ninja-1.13.2-sccache-0.17.0-${{ hashFiles('tools/prepare-fast-toolchain.ps1') }}
          restore-keys: |
            ${{ runner.os }}-release-fast-toolchain-llvm-22.1.8-cmake-3.31.8-ninja-1.13.2-sccache-0.17.0-
            ${{ runner.os }}-fast-toolchain-

      - name: Prepare fast Windows toolchain
        shell: pwsh
        run: ./tools/prepare-fast-toolchain.ps1 -InstallForCI

      - name: Configure CI compiler cache
        shell: pwsh
        run: ./tools/configure-ci-cache.ps1

      - name: Require the matching release tag
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/tags/v${{ inputs.version }}') {
            throw 'Release must run from the matching v<version> tag.'
          }

      - name: Build once, analyze, test, and stage
        shell: pwsh
        env:
          FCITX_PACKAGE_VERSION: ${{ inputs.version }}
          FCITX_PACKAGE_CHANNEL: ${{ inputs.channel }}
        run: ./tools/verify-product.ps1 package -Version $env:FCITX_PACKAGE_VERSION -Channel $env:FCITX_PACKAGE_CHANNEL

      - name: Show compiler cache stats
        if: always()
        shell: pwsh
        run: |
          $sccache = Get-Command sccache -ErrorAction SilentlyContinue
          if ($sccache) {
            & $sccache.Source --show-stats
          }

      - name: Upload only the verified lineage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-lineage
          path: out/package
          retention-days: 1
          if-no-files-found: error

  sign-and-publish:
    needs: build-once
    runs-on: windows-2022
    environment: release
    permissions:
      contents: write
    steps:
      - name: Require PowerShell 7
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -ne 7) {
            throw "PowerShell 7 is required; found $($PSVersionTable.PSVersion)."
          }

      - name: Check out the same source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download verified lineage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-lineage
          path: out/package

      - name: Restore stage pointer and protected release material
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          UPDATE_KEYRING_BASE64: ${{ secrets.UPDATE_KEYRING_BASE64 }}
          PQC_SIGNING_SECRET_KEY_BASE64: ${{ secrets.PQC_SIGNING_SECRET_KEY_BASE64 }}
        run: |
          $stage = Get-ChildItem out/package -Directory -Filter 'stage-*' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $stage) { throw 'Verified stage was not transferred.' }
          [IO.File]::WriteAllText((Resolve-Path out/package/current-stage.txt),
            $stage.FullName, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/signing.pfx",
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/trusted-keys.json",
            [Convert]::FromBase64String($env:UPDATE_KEYRING_BASE64))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/fcitx5-release-mldsa65.key",
            [Convert]::FromBase64String($env:PQC_SIGNING_SECRET_KEY_BASE64))
          $secure = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP/signing.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "FCITX_RELEASE_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "FCITX_RELEASE_TRUSTED_KEYRING=$env:RUNNER_TEMP/trusted-keys.json" >> $env:GITHUB_ENV
          "FCITX_RELEASE_PQC_SIGNING_KEY=$env:RUNNER_TEMP/fcitx5-release-mldsa65.key" >> $env:GITHUB_ENV

      - name: Enforce monotonic official plugin sequence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FCITX_RELEASE_PLUGIN_SEQUENCE: ${{ inputs.plugin_release_sequence }}
          FCITX_RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          [UInt64] $requested = 0
          if (-not [UInt64]::TryParse($env:FCITX_RELEASE_PLUGIN_SEQUENCE, [ref]$requested) -or
              $requested -eq 0) {
            throw 'plugin_release_sequence must be a positive unsigned integer.'
          }
          $stage = Get-ChildItem out/package -Directory -Filter 'stage-*' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $stage) { throw 'Verified stage was not transferred.' }
          $packageCli = Join-Path $stage.FullName 'bin/fcitx5-package.exe'
          if (-not (Test-Path -LiteralPath $packageCli -PathType Leaf)) {
            throw 'Verified Package CLI is missing from the build-once lineage.'
          }
          $repository = '0x696c757a696f/fcitx5-windows-next'
          $pages = & gh api --paginate --slurp "repos/$repository/releases?per_page=100" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read published release history.' }
          $temporaryRoot = Join-Path $env:RUNNER_TEMP 'fcitx5-plugin-sequence-history'
          [UInt64] $maximum = 0
          try {
            foreach ($page in @($pages)) {
              foreach ($release in @($page)) {
                $assets = @($release.assets | ForEach-Object name)
                if ($assets -notcontains 'index.json' -or $assets -notcontains 'index.sig.json') {
                  continue
                }
                $candidate = Join-Path $temporaryRoot ([string]$release.id)
                New-Item -ItemType Directory -Force -Path $candidate | Out-Null
                & gh release download $release.tag_name -R $repository -p index.json -p index.sig.json `
                  -D $candidate --clobber
                if ($LASTEXITCODE -ne 0) {
                  throw "Could not download signed plugin metadata for $($release.tag_name)."
                }
                & $packageCli --verify-repository-v2 (Join-Path $candidate 'index.json') `
                  (Join-Path $candidate 'index.sig.json') $env:FCITX_RELEASE_TRUSTED_KEYRING `
                  $env:FCITX_RELEASE_CHANNEL
                if ($LASTEXITCODE -ne 0) {
                  throw "Published plugin metadata for $($release.tag_name) did not verify."
                }
                $index = Get-Content -LiteralPath (Join-Path $candidate 'index.json') -Raw |
                  ConvertFrom-Json
                $rime = @($index.packages | Where-Object { $_.id -eq 'fcitx5-rime' })
                if ($rime.Count -ne 1) {
                  throw "Published plugin metadata for $($release.tag_name) has no unique Rime entry."
                }
                [UInt64] $sequence = 0
                if (-not [UInt64]::TryParse([string]$rime[0].release_sequence, [ref]$sequence)) {
                  throw "Published plugin metadata for $($release.tag_name) has an invalid sequence."
                }
                if ($sequence -gt $maximum) { $maximum = $sequence }
              }
            }
          } finally {
            Remove-Item -LiteralPath $temporaryRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($requested -le $maximum) {
            throw "plugin_release_sequence $requested is not greater than published maximum $maximum."
          }

      - name: Sign and promote the verified lineage without rebuilding
        shell: pwsh
        env:
          FCITX_RELEASE_VERSION: ${{ inputs.version }}
          FCITX_RELEASE_CHANNEL: ${{ inputs.channel }}
          FCITX_RELEASE_PLUGIN_SEQUENCE: ${{ inputs.plugin_release_sequence }}
        run: |
          ./tools/release.ps1 -Version $env:FCITX_RELEASE_VERSION `
            -Channel $env:FCITX_RELEASE_CHANNEL `
            -CertificateThumbprint $env:FCITX_RELEASE_CERT_THUMBPRINT `
            -TrustedKeyring $env:FCITX_RELEASE_TRUSTED_KEYRING `
            -PluginSigningKey $env:FCITX_RELEASE_PQC_SIGNING_KEY `
            -PluginReleaseSequence $env:FCITX_RELEASE_PLUGIN_SEQUENCE

      - name: Publish exact release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('release', 'create', 'v${{ inputs.version }}',
            'out/package/release-artifacts/*', '--verify-tag',
            '--title', 'Fcitx5 for Windows ${{ inputs.version }}', '--generate-notes')
          if ('${{ inputs.channel }}' -ne 'stable') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }

      - name: Remove imported signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:FCITX_RELEASE_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:FCITX_RELEASE_CERT_THUMBPRINT" -Force
          }
          Remove-Item "$env:RUNNER_TEMP/fcitx5-release-mldsa65.key" -Force -ErrorAction SilentlyContinue
