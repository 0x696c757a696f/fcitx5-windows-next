name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish; the v<version> tag is created on the dispatched commit
        required: true
        type: string
      channel:
        description: Release identity and repository channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, nightly]
      plugin_release_sequence:
        description: Monotonic release sequence for the official fcitx5-rime package
        required: true
        type: number
      without_authenticode:
        description: Publish as a pre-release without Authenticode signatures (no code signing certificate yet)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-once:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Require PowerShell 7
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -ne 7) {
            throw "PowerShell 7 is required; found $($PSVersionTable.PSVersion)."
          }

      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Require an unpublished version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ inputs.version }}'
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) {
            throw "Release dispatched from tag ${{ github.ref_name }} cannot publish $tag."
          }
          & gh release view $tag -R '${{ github.repository }}' --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag is already published." }
          $global:LASTEXITCODE = 0

      - name: Restore Rust toolchain and target cache
        uses: actions/cache@v6
        with:
          path: |
            out/toolchains/rust/rustup-home
            out/toolchains/rust/cargo-home/registry
            out/toolchains/rust/cargo-home/git
            out/toolchains/rust/cargo-home/bin
            out/toolchains/rust/target
          key: ${{ runner.os }}-release-rust-msvc-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**/Cargo.toml', 'tools/prepare-rust.ps1') }}
          restore-keys: |
            ${{ runner.os }}-release-rust-msvc-
            ${{ runner.os }}-rust-msvc-

      - name: Install sccache compiler cache
        uses: Mozilla-Actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Restore fast Windows toolchain cache
        uses: actions/cache@v6
        with:
          path: out/toolchains/fast
          key: ${{ runner.os }}-release-fast-toolchain-llvm-22.1.8-cmake-3.31.8-ninja-1.13.2-sccache-0.19.0-${{ hashFiles('tools/prepare-fast-toolchain.ps1') }}
          restore-keys: |
            ${{ runner.os }}-release-fast-toolchain-llvm-22.1.8-cmake-3.31.8-ninja-1.13.2-sccache-0.19.0-
            ${{ runner.os }}-fast-toolchain-

      - name: Prepare fast Windows toolchain
        shell: pwsh
        run: ./tools/prepare-fast-toolchain.ps1 -InstallForCI

      - name: Configure CI compiler cache
        shell: pwsh
        run: ./tools/configure-ci-cache.ps1

      - name: Restore MSYS2 toolchain cache
        uses: actions/cache@v6
        with:
          path: |
            out/downloads
            out/toolchains/msys64
          key: ${{ runner.os }}-msys2-clang64-${{ hashFiles('tools/bootstrap-fcitx.ps1') }}
          restore-keys: |
            ${{ runner.os }}-msys2-clang64-

      - name: Restore native Fcitx build cache
        uses: actions/cache@v6
        with:
          path: |
            out/sources
            out/stage/fcitx5
            out/build/fcitx5-core
            out/build/libime
            out/build/fcitx5-chinese-addons
            out/build/librime
            out/build/fcitx5-rime
            out/build/fcitx5-lua
            out/build/fcitx5-unikey
            out/build/native-engine
          key: ${{ runner.os }}-fcitx-native-${{ hashFiles('tools/bootstrap-fcitx.ps1', 'third_party/patches/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fcitx-native-${{ hashFiles('tools/bootstrap-fcitx.ps1', 'third_party/patches/**') }}-

      - name: Prepare Rust for the native engine
        run: |
          ./tools/prepare-rust.ps1
          ./tools/prepare-package-dependencies.ps1
          rustup target add x86_64-pc-windows-gnu --toolchain 1.99.1-x86_64-pc-windows-msvc
          # native-engine invokes cargo from the repository CARGO_HOME. The
          # runner's rustup lives elsewhere, so give that bin directory rustup
          # proxies of its own.
          $bin = Join-Path $env:CARGO_HOME 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $rustup = (Get-Command rustup -ErrorAction Stop).Source
          foreach ($proxy in @('cargo.exe', 'rustc.exe')) {
            $path = Join-Path $bin $proxy
            if (-not (Test-Path -LiteralPath $path)) {
              Copy-Item -LiteralPath $rustup -Destination $path
            }
          }

      - name: Bootstrap native Fcitx engine
        run: |
          # The first bootstrap verifies and unpacks the MSYS2 archive with
          # Git for Windows' xz and gpg, which are not on PATH by default.
          $env:PATH = "$env:PATH;C:\Program Files\Git\usr\bin"
          # The cache does not restore the Rime plugin junctions as junctions;
          # drop whatever came back so bootstrap links the pinned checkouts.
          foreach ($plugin in @('librime-lua', 'librime-octagram', 'librime-proto', 'librime-predict')) {
            $link = "out/sources/librime/plugins/$plugin"
            if (-not (Test-Path -LiteralPath $link)) { continue }
            $item = Get-Item -LiteralPath $link -Force
            if ($item.LinkType -eq 'Junction') { continue }
            if ($item.LinkType) { $item.Delete() } else { Remove-Item -LiteralPath $link -Recurse -Force }
          }
          # native-engine runs several cargo builds in parallel through this
          # sccache; start its server once so they do not race to spawn it.
          & ./out/toolchains/fast/sccache-0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc/sccache.exe --start-server
          ./tools/bootstrap-fcitx.ps1
          # The package gate runs the real Fcitx acceptance against the
          # official-rebaseline roots; reuse the tree just built for them.
          foreach ($pair in @(@('official-rebaseline-sources', 'sources'),
                              @('official-rebaseline-stage', 'stage/fcitx5'))) {
            $link = Join-Path 'out' $pair[0]
            if (-not (Test-Path -LiteralPath $link)) {
              New-Item -ItemType Junction -Path $link `
                -Target (Resolve-Path (Join-Path 'out' $pair[1])).Path | Out-Null
            }
          }

      - name: Build once, analyze, test, and stage
        shell: pwsh
        env:
          FCITX_PACKAGE_VERSION: ${{ inputs.version }}
          FCITX_PACKAGE_CHANNEL: ${{ inputs.channel }}
        run: ./tools/verify-product.ps1 package -Version $env:FCITX_PACKAGE_VERSION -Channel $env:FCITX_PACKAGE_CHANNEL

      - name: Show compiler cache stats
        if: always()
        shell: pwsh
        run: |
          $sccache = Get-Command sccache -ErrorAction SilentlyContinue
          if ($sccache) {
            & $sccache.Source --show-stats
          }

      - name: Upload only the verified lineage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-lineage
          path: out/package
          retention-days: 1
          if-no-files-found: error

  sign-and-publish:
    needs: build-once
    runs-on: windows-2022
    environment: release
    permissions:
      contents: write
    steps:
      - name: Require PowerShell 7
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -ne 7) {
            throw "PowerShell 7 is required; found $($PSVersionTable.PSVersion)."
          }

      - name: Check out the same source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download verified lineage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-lineage
          path: out/package

      - name: Restore stage pointer and protected release material
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          WITHOUT_AUTHENTICODE: ${{ inputs.without_authenticode }}
          UPDATE_KEYRING_BASE64: ${{ secrets.UPDATE_KEYRING_BASE64 }}
          PQC_SIGNING_SECRET_KEY_BASE64: ${{ secrets.PQC_SIGNING_SECRET_KEY_BASE64 }}
          ED25519_SIGNING_SEED_BASE64: ${{ secrets.ED25519_SIGNING_SEED_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ED25519_SIGNING_SEED_BASE64)) {
            throw 'The ED25519_SIGNING_SEED_BASE64 release secret is not configured.'
          }
          # The build job's pointer names the verified stage; out/package also
          # holds other stage-* directories, and downloaded timestamps are
          # meaningless for picking between them.
          $pointer = 'out/package/current-stage.txt'
          if (-not (Test-Path -LiteralPath $pointer -PathType Leaf)) {
            throw 'Verified stage pointer was not transferred.'
          }
          # The pointer holds the build runner's absolute <out/package>/stage-*/Fcitx5.
          $recorded = (Get-Content -LiteralPath $pointer -Raw).Trim()
          $name = Split-Path -Leaf (Split-Path -Parent $recorded)
          $stage = Get-Item -LiteralPath (Join-Path out/package $name 'Fcitx5') -ErrorAction SilentlyContinue
          if (-not $stage -or -not $stage.PSIsContainer -or $name -notlike 'stage-*' -or
              (Split-Path -Leaf $recorded) -ne 'Fcitx5') {
            throw 'Verified stage was not transferred.'
          }
          [IO.File]::WriteAllText((Resolve-Path out/package/current-stage.txt),
            $stage.FullName, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/trusted-keys.json",
            [Convert]::FromBase64String($env:UPDATE_KEYRING_BASE64))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/fcitx5-release-mldsa65.key",
            [Convert]::FromBase64String($env:PQC_SIGNING_SECRET_KEY_BASE64))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/fcitx5-release-ed25519.seed",
            [Convert]::FromBase64String($env:ED25519_SIGNING_SEED_BASE64))
          if ($env:WITHOUT_AUTHENTICODE -ne 'true') {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/signing.pfx",
              [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $secure = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP/signing.pfx" `
              -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            Remove-Item "$env:RUNNER_TEMP/signing.pfx" -Force
            "FCITX_RELEASE_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          }
          "FCITX_RELEASE_TRUSTED_KEYRING=$env:RUNNER_TEMP/trusted-keys.json" >> $env:GITHUB_ENV
          "FCITX_RELEASE_PQC_SIGNING_KEY=$env:RUNNER_TEMP/fcitx5-release-mldsa65.key" >> $env:GITHUB_ENV
          "FCITX_RELEASE_ED25519_SIGNING_KEY=$env:RUNNER_TEMP/fcitx5-release-ed25519.seed" >> $env:GITHUB_ENV

      - name: Enforce monotonic official plugin sequence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FCITX_RELEASE_PLUGIN_SEQUENCE: ${{ inputs.plugin_release_sequence }}
          FCITX_RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          [UInt64] $requested = 0
          if (-not [UInt64]::TryParse($env:FCITX_RELEASE_PLUGIN_SEQUENCE, [ref]$requested) -or
              $requested -eq 0) {
            throw 'plugin_release_sequence must be a positive unsigned integer.'
          }
          $repository = '0x696c757a696f/fcitx5-windows-next'
          $pages = & gh api --paginate --slurp "repos/$repository/releases?per_page=100" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read published release history.' }
          $temporaryRoot = Join-Path $env:RUNNER_TEMP 'fcitx5-plugin-sequence-history'
          [UInt64] $maximum = 0
          try {
            foreach ($page in @($pages)) {
              foreach ($release in @($page)) {
                $assets = @($release.assets | ForEach-Object name)
                if ($assets -notcontains 'index.json' -or $assets -notcontains 'index.sig.json') {
                  continue
                }
                $candidate = Join-Path $temporaryRoot ([string]$release.id)
                New-Item -ItemType Directory -Force -Path $candidate | Out-Null
                & gh release download $release.tag_name -R $repository -p index.json -p index.sig.json `
                  -D $candidate --clobber
                if ($LASTEXITCODE -ne 0) {
                  throw "Could not download signed plugin metadata for $($release.tag_name)."
                }
                # Older indexes expire and other channels' indexes do not verify
                # against this channel, so read the history directly. Both the
                # package sequence and the index sequence (which the scheduled
                # refresh advances) must stay below the new release.
                $index = Get-Content -LiteralPath (Join-Path $candidate 'index.json') -Raw |
                  ConvertFrom-Json
                $rime = @($index.packages | Where-Object { $_.id -eq 'fcitx5-rime' })
                if ($rime.Count -ne 1) {
                  throw "Published plugin metadata for $($release.tag_name) has no unique Rime entry."
                }
                foreach ($value in @($rime[0].release_sequence, $index.sequence)) {
                  [UInt64] $sequence = 0
                  if (-not [UInt64]::TryParse([string]$value, [ref]$sequence)) {
                    throw "Published plugin metadata for $($release.tag_name) has an invalid sequence."
                  }
                  if ($sequence -gt $maximum) { $maximum = $sequence }
                }
              }
            }
          } finally {
            Remove-Item -LiteralPath $temporaryRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($requested -le $maximum) {
            throw "plugin_release_sequence $requested is not greater than published maximum $maximum."
          }

      - name: Sign and promote the verified lineage without rebuilding
        shell: pwsh
        env:
          FCITX_RELEASE_VERSION: ${{ inputs.version }}
          FCITX_RELEASE_CHANNEL: ${{ inputs.channel }}
          FCITX_RELEASE_PLUGIN_SEQUENCE: ${{ inputs.plugin_release_sequence }}
          WITHOUT_AUTHENTICODE: ${{ inputs.without_authenticode }}
        run: |
          $authenticode = if ($env:WITHOUT_AUTHENTICODE -eq 'true') {
            @{ WithoutAuthenticode = $true }
          } else {
            @{ CertificateThumbprint = $env:FCITX_RELEASE_CERT_THUMBPRINT }
          }
          ./tools/release.ps1 -Version $env:FCITX_RELEASE_VERSION `
            -Channel $env:FCITX_RELEASE_CHANNEL `
            -TrustedKeyring $env:FCITX_RELEASE_TRUSTED_KEYRING `
            -PluginSigningKey $env:FCITX_RELEASE_PQC_SIGNING_KEY `
            -Ed25519SigningKey $env:FCITX_RELEASE_ED25519_SIGNING_KEY `
            -PluginReleaseSequence $env:FCITX_RELEASE_PLUGIN_SEQUENCE @authenticode

      - name: Publish exact release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag is created here, on the commit both jobs built and signed.
          # A tag left by an earlier failed attempt has no release yet, so it
          # is moved rather than trusted.
          $tag = 'v${{ inputs.version }}'
          $existing = & gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq .object.sha 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            & gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not replace stale tag $tag." }
          }
          $global:LASTEXITCODE = 0
          $arguments = @('release', 'create', $tag,
            'out/package/release-artifacts/*', '--target', '${{ github.sha }}',
            '--title', 'Fcitx5 for Windows ${{ inputs.version }}', '--generate-notes')
          if ('${{ inputs.channel }}' -ne 'stable' -or '${{ inputs.without_authenticode }}' -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }

      - name: Remove imported signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:FCITX_RELEASE_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:FCITX_RELEASE_CERT_THUMBPRINT" -Force
          }
          Remove-Item "$env:RUNNER_TEMP/fcitx5-release-mldsa65.key" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP/fcitx5-release-ed25519.seed" -Force -ErrorAction SilentlyContinue
