name: Preview Package

# Unsigned developer-preview builds of the installer and portable ZIP for
# every change on main (or on demand). These are not release artifacts:
# signing and publishing stay in release.yml. Pull requests that change what
# goes into the plugin packages build it too, so a stale inventory fails there
# and not in a release.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/preview-package.yml
      - third_party/patches/**
      - tools/bootstrap-fcitx.ps1
      - tools/check-plugin-inventory.py
      - tools/fork-plugin-inventory.json
      - tools/prepare-fork-plugins.ps1
      - tools/release-plugin-inventory.json
      - tools/stage-package.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  package:
    name: Installer and portable ZIP
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Require PowerShell 7
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -ne 7) {
            throw "PowerShell 7 is required; found $($PSVersionTable.PSVersion)."
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Restore Rust toolchain and target cache
        uses: actions/cache@v6
        with:
          path: |
            out/toolchains/rust/rustup-home
            out/toolchains/rust/cargo-home/registry
            out/toolchains/rust/cargo-home/git
            out/toolchains/rust/cargo-home/bin
            out/toolchains/rust/target
          key: ${{ runner.os }}-release-rust-msvc-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**/Cargo.toml', 'tools/prepare-rust.ps1') }}
          restore-keys: |
            ${{ runner.os }}-release-rust-msvc-
            ${{ runner.os }}-rust-msvc-

      - name: Install sccache compiler cache
        uses: Mozilla-Actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Restore fast Windows toolchain cache
        uses: actions/cache@v6
        with:
          path: out/toolchains/fast
          key: ${{ runner.os }}-release-fast-toolchain-llvm-22.1.8-cmake-3.31.8-ninja-1.13.2-sccache-0.19.0-${{ hashFiles('tools/prepare-fast-toolchain.ps1') }}
          restore-keys: |
            ${{ runner.os }}-release-fast-toolchain-llvm-22.1.8-cmake-3.31.8-ninja-1.13.2-sccache-0.19.0-
            ${{ runner.os }}-fast-toolchain-

      - name: Prepare fast Windows toolchain
        run: ./tools/prepare-fast-toolchain.ps1 -InstallForCI

      - name: Configure CI compiler cache
        run: ./tools/configure-ci-cache.ps1

      - name: Restore MSYS2 toolchain cache
        uses: actions/cache@v6
        with:
          path: |
            out/downloads
            out/toolchains/msys64
          key: ${{ runner.os }}-msys2-clang64-${{ hashFiles('tools/bootstrap-fcitx.ps1') }}
          restore-keys: |
            ${{ runner.os }}-msys2-clang64-

      - name: Restore native Fcitx build cache
        uses: actions/cache@v6
        with:
          path: |
            out/sources
            out/stage/fcitx5
            out/build/fcitx5-core
            out/build/libime
            out/build/fcitx5-chinese-addons
            out/build/librime
            out/build/fcitx5-rime
            out/build/fcitx5-lua
            out/build/fcitx5-unikey
            out/build/native-engine
          key: ${{ runner.os }}-fcitx-native-${{ hashFiles('tools/bootstrap-fcitx.ps1', 'third_party/patches/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fcitx-native-${{ hashFiles('tools/bootstrap-fcitx.ps1', 'third_party/patches/**') }}-

      - name: Prepare Rust for the native engine
        run: |
          ./tools/prepare-rust.ps1
          ./tools/prepare-package-dependencies.ps1
          rustup target add x86_64-pc-windows-gnu --toolchain 1.99.1-x86_64-pc-windows-msvc
          # native-engine invokes cargo from the repository CARGO_HOME. The
          # runner's rustup lives elsewhere, so give that bin directory rustup
          # proxies of its own.
          $bin = Join-Path $env:CARGO_HOME 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $rustup = (Get-Command rustup -ErrorAction Stop).Source
          foreach ($proxy in @('cargo.exe', 'rustc.exe')) {
            $path = Join-Path $bin $proxy
            if (-not (Test-Path -LiteralPath $path)) {
              Copy-Item -LiteralPath $rustup -Destination $path
            }
          }

      - name: Bootstrap native Fcitx engine
        run: |
          # The first bootstrap verifies and unpacks the MSYS2 archive with
          # Git for Windows' xz and gpg, which are not on PATH by default.
          $env:PATH = "$env:PATH;C:\Program Files\Git\usr\bin"
          # The cache does not restore the Rime plugin junctions as junctions;
          # drop whatever came back so bootstrap links the pinned checkouts.
          foreach ($plugin in @('librime-lua', 'librime-octagram', 'librime-proto', 'librime-predict')) {
            $link = "out/sources/librime/plugins/$plugin"
            if (-not (Test-Path -LiteralPath $link)) { continue }
            $item = Get-Item -LiteralPath $link -Force
            if ($item.LinkType -eq 'Junction') { continue }
            if ($item.LinkType) { $item.Delete() } else { Remove-Item -LiteralPath $link -Recurse -Force }
          }
          # native-engine runs several cargo builds in parallel through this
          # sccache; start its server once so they do not race to spawn it.
          & ./out/toolchains/fast/sccache-0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc/sccache.exe --start-server
          ./tools/bootstrap-fcitx.ps1
          # The package gate runs the real Fcitx acceptance against the
          # official-rebaseline roots; reuse the tree just built for them.
          foreach ($pair in @(@('official-rebaseline-sources', 'sources'),
                              @('official-rebaseline-stage', 'stage/fcitx5'))) {
            $link = Join-Path 'out' $pair[0]
            if (-not (Test-Path -LiteralPath $link)) {
              New-Item -ItemType Junction -Path $link `
                -Target (Resolve-Path (Join-Path 'out' $pair[1])).Path | Out-Null
            }
          }

      - name: Build, test, and stage the unsigned package
        run: ./tools/verify-product.ps1 package -Version 0.1.0 -Channel nightly

      - name: Verify the pinned fork plugins against the staged runtime
        timeout-minutes: 30
        run: |
          $stage = (Get-Content -LiteralPath out/package/current-stage.txt -Raw).Trim()
          ./tools/prepare-fork-plugins.ps1 -StageRoot $stage

      - name: Check the plugin inventories against the build output
        run: |
          $stage = (Get-Content -LiteralPath out/package/current-stage.txt -Raw).Trim()
          python tools/check-plugin-inventory.py --stage $stage --fork-root out/package/fork-plugins
          if ($LASTEXITCODE -ne 0) { throw 'Plugin inventory does not match the build output.' }

      - name: Show compiler cache stats
        if: always()
        run: |
          $sccache = Get-Command sccache -ErrorAction SilentlyContinue
          if ($sccache) {
            & $sccache.Source --show-stats
          }

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fcitx5-windows-setup-${{ github.sha }}
          path: out/package/artifacts/*-setup.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fcitx5-windows-portable-${{ github.sha }}
          path: out/package/artifacts/*-portable.zip
          retention-days: 14
          if-no-files-found: error
