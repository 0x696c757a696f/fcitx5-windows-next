[workspace]
resolver = "2"
members = [
  "rust/launcher-core",
  "rust/package-core",
  "rust/control-core",
  "rust/process-execution-core",
  "rust/config-qa",
  "rust/config-poc",
  "rust/candidate-core",
  "rust/tsf-poc",
]

[profile.dev]
opt-level = 0
debug = "line-tables-only"
codegen-units = 16
lto = false
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
opt-level = 0
debug = "line-tables-only"
codegen-units = 16
lto = false
incremental = true

[profile.debugging]
inherits = "dev"
debug = true
